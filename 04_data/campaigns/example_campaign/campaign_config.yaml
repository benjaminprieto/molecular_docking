# =============================================================================
# Campaign Configuration — example_campaign
# =============================================================================
# Fuente de verdad para una campaña de docking.
# Equivalente a cavity_config.yaml en dock2profile.
#
# Una CAMPAÑA = un receptor + un set de moléculas + condiciones de docking.
#
# NOTA: Copiar a 04_data/campaigns/{campaign_id}/ y editar.
#
# Project: molecular_docking
# Version: 1.1 (2026-03-13)
# =============================================================================

# --- Identidad ---
campaign_id: "example_campaign"
description: "Example docking campaign"

# --- Receptor ---
receptor:
  # PDB del receptor (relativo al directorio de la campaña)
  pdb: "receptor/XT1_6EJ7.pdb"

  # Chain(s) a conservar (null = todas)
  chain: null

  # Protonación del receptor
  # Strategies (v2.0 — ChimeraX backbone):
  #   pdb2pqr  -> PDB2PQR+PROPKA + ChimeraX mol2 (RECOMENDADA)
  #   chimerax -> ChimeraX DockPrep directo
  #   obabel   -> OpenBabel fallback (NO RECOMENDADA)
  protonation:
    enabled: true
    tool: "pdb2pqr"
    force_field: "AMBER"

  # mol2 pre-preparado (si ya tienes receptor listo para DOCK6)
  # Si protonation.enabled=true, este campo se ignora.
  prepared_mol2: null

  # Opciones de limpieza del PDB
  remove_water: true
  remove_hetatm: true

# --- pH de docking ---
# Afecta protonación de receptor (si enabled) y ligandos (si enabled).
# Ejemplos:
#   7.2-7.4  → fisiológico (citoplasma)
#   6.2-6.5  → Golgi apparatus / endosomas tempranos
#   5.0-5.5  → lisosomas / endosomas tardíos
#   4.5-5.0  → estómago
docking_ph: 7.2

# --- Moléculas de entrada ---
molecules:
  # Archivo o directorio con moléculas a dockear
  # Formatos: SDF, CSV/XLSX, mol2, SMILES txt, directorio mixto
  input_file: "molecules/"

  # Para CSV/XLSX: columnas con nombre y SMILES
  name_column: "Name"
  smiles_column: "Smile"

  # Para SDF: cómo extraer el nombre de la molécula
  # "header_first_word" = primera palabra del header
  # "header_full"       = header completo
  # "property"          = leer de propiedad SDF (ver name_property)
  name_source: "header_first_word"
  name_property: "_Name"

  # Protonación de ligandos
  # Herramientas para ligandos pequeños:
  #   obabel       -> OpenBabel -p pH (usado por 00c ionization_profiling)
  #   dimorphite_dl -> Dimorphite-DL (más preciso, requiere instalación aparte)
  # NOTA: pdb2pqr es para proteínas, NO para ligandos.
  protonation:
    enabled: true
    tool: "obabel"
    obabel_fallback: true

# --- Grids DOCK6 ---
grids:
  # Directorio con grids pre-existentes (relativo a campaña O absoluto)
  # Si los grids existen y son válidos, 01a se salta automáticamente.
  grid_dir: "grids/"
  spheres_file: "spheres_ligand.sph"
  energy_grid: "ligand.nrg"
  bump_grid: "ligand.bmp"

  # Generación de grids (si no existen)
  generate: true

  # Definición del binding site (solo si generate=true)
  # Métodos:
  #   reference_ligand  → esferas cerca de un ligando cristalográfico (estándar DOCK6)
  #   residues          → centroide de residuos clave (no necesita ligando)
  #   coordinates       → punto (x, y, z) explícito
  binding_site:
    method: "reference_ligand"

    # Método A: reference_ligand
    # IMPORTANTE: usar UDX.mol2 (cristalográfico), NO UDX_mol2.mol2 (coords regeneradas)
    reference_mol2: "molecules/UDX.mol2"

    # Método B: residues (centroide se calcula automáticamente)
    # residues:
    #   - "GLU529"
    #   - "TRP555"
    #   - "CYS574"

    # Método C: coordenadas explícitas
    # center: [10.5, 15.2, 22.8]

    # Radio para selección de esferas (Angstroms, todos los métodos)
    radius: 10.0

# --- Output ---
output:
  # Nombre del Excel final (compatible con dock2profile)
  scores_filename: "01_top_500_molecules.xlsx"

  # Nombre del directorio con mol2 individuales (compatible con dock2profile)
  mol2_dirname: "docked_molecules"

# --- Metadatos de trazabilidad ---
metadata:
  source: null
  date: null
  notes: null