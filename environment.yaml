# =============================================================================
# molecular_docking - Conda Environment
# =============================================================================
# conda env create -f environment.yaml
# conda activate molecular_docking_env
# pip install -e ".[dev]"
# =============================================================================

name: molecular_docking_env

channels:
  - conda-forge
  - defaults

dependencies:
  - python>=3.9,<3.13
  - pandas>=1.5
  - numpy>=1.23
  - scipy>=1.9
  - openpyxl>=3.0
  - pyyaml>=6.0
  - rdkit>=2023.03.1
  - openbabel>=3.1.1
  - ambertools>=22.0
  - matplotlib>=3.6
  - seaborn>=0.12
  - pytest>=7.0
  - pytest-cov>=4.0
  - tqdm>=4.64
  - lxml>=4.9
  - pip
  - pip:
      - dimorphite_dl>=1.3.2
      - pdb2pqr>=3.6.0
