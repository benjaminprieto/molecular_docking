# =============================================================================
# 01c DOCK6 Run - Configuration (DOCK6 engine)
# =============================================================================
# Runs DOCK6 flexible/rigid docking for each prepared ligand.
#
# OUTPUT: 05_results/{campaign_id}/01c_dock6_run/
#
# Project: molecular_docking
# Module: 01c (DOCK6)
# Version: 4.3 — GB/SA Hawkins implicit solvation option (2026-03-25)
#
# CHANGES v4.2 → v4.3:
#   - Added gbsa_hawkins option (secondary score with implicit solvation).
#     Corrects in-vacuo electrostatic artifacts for charged residues.
#     Default: off (adds ~2-5x runtime per molecule).
# =============================================================================

parameters:
  search_method: "flex"
  min_anchor_size: 5
  pruning_max_orients: 1000

  # --- CRITICAL FIX: was 100 (Ångström!), must be 2.0 Å ---
  pruning_clustering_cutoff: 2.0
  pruning_conformer_score_cutoff: 100.0

  # --- Sampling (v4.0+) ---
  max_orientations: 5000
  simplex_max_cycles: 5
  simplex_random_seed: -1

  # --- Output poses ---
  # DOCK6 6.13 params (these override num_scored_conformers):
  num_final_scored_poses: 100
  num_preclustered_conformers: 500
  # Legacy param (DOCK6 <6.13 fallback):
  num_scored_conformers: 100

  # --- Minimization ---
  minimize: true
  simplex_max_iterations: 500
  simplex_score_converge: 0.1
  simplex_cycle_converge: 1.0
  simplex_trans_step: 1.0
  simplex_rot_step: 0.1
  simplex_tors_step: 10.0

  # --- Footprint Scoring (per-residue energy decomposition) ---
  # Decomposes Grid_Score into vdW + ES contribution per receptor residue.
  # Output: footprint columns in scored mol2 header.
  compute_footprint_score: true

  # ┌───────────────────────────────────────────────────────────────┐
  # │  GB/SA Hawkins — Implicit Solvation (secondary score)        │
  # │                                                               │
  # │  Adds Generalized Born / Surface Area solvation correction   │
  # │  as a secondary score alongside Grid_Score (primary).        │
  # │  Screens electrostatic interactions that are artificially     │
  # │  strong in-vacuo (e.g., ASP494⁻ vs PO₄²⁻ repulsion).       │
  # │                                                               │
  # │  Enable for: reference crystal analysis, charged pockets     │
  # │  Disable for: large screening campaigns (adds runtime)       │
  # └───────────────────────────────────────────────────────────────┘
  gbsa_hawkins: false
  solvent_dielectric: 78.5
  salt_concentration: 0.15
  gb_offset: 0.09

  # --- Output ---
  write_orientations: false

  # --- Execution ---
  timeout_per_molecule: 1800
  log_level: "INFO"

outputs:
  subdir: "01c_dock6_run"

# =============================================================================
# USAGE
# =============================================================================
# # Standard (in-vacuo only):
# python 02_scripts/01c_dock6_run.py --config 03_configs/01c_dock6_run.yaml \
#     --campaign 04_data/campaigns/example_campaign/campaign_config.yaml
#
# # With GB/SA Hawkins (set gbsa_hawkins: true above, or use reference mode)
# =============================================================================