# =============================================================================
# 01c DOCK6 Run - Configuration (DOCK6 engine)
# =============================================================================
# Runs DOCK6 flexible/rigid docking for each prepared ligand.
#
# ROUTING (v3.0):
#   Ligands: 01a_antechamber/mol2/ first, then 00c_ligand_preparation/mol2/
#   Grids:   01b_grid_generation/ first, then campaign grids.grid_dir
#
# PATH FIX:
#   DOCK6 truncates paths at ~80 chars (Fortran legacy).
#   This module creates symlinks in each mol_out/ and uses short filenames.
#
# OUTPUT: 05_results/{campaign_id}/01c_dock6_run/
#
# Renumbered from 01b (2026-03-16).
#
# Project: molecular_docking
# Module: 01c (DOCK6)
# Version: 3.0
# =============================================================================

parameters:
  search_method: "flex"
  min_anchor_size: 5
  pruning_max_orients: 1000
  pruning_clustering_cutoff: 100
  pruning_conformer_score_cutoff: 100.0
  max_orientations: 1000
  minimize: true
  simplex_max_iterations: 500
  simplex_max_cycles: 1
  simplex_score_converge: 0.1
  simplex_cycle_converge: 1.0
  simplex_trans_step: 1.0
  simplex_rot_step: 0.1
  simplex_tors_step: 10.0
  num_scored_conformers: 20
  write_orientations: false
  timeout_per_molecule: 600
  log_level: "INFO"

outputs:
  subdir: "01c_dock6_run"

# =============================================================================
# USAGE
# =============================================================================
# python 02_scripts/01c_dock6_run.py --config 03_configs/01c_dock6_run.yaml --campaign 04_data/campaigns/example_campaign/campaign_config.yaml
#
# # Single molecule:
# python 02_scripts/01c_dock6_run.py --config 03_configs/01c_dock6_run.yaml --campaign 04_data/campaigns/example_campaign/campaign_config.yaml --name MolPort-047-542-199
#
# # Dry run:
# python 02_scripts/01c_dock6_run.py --config 03_configs/01c_dock6_run.yaml --campaign 04_data/campaigns/example_campaign/campaign_config.yaml --dry-run
# =============================================================================
