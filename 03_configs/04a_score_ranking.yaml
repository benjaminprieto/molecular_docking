# =============================================================================
# 04a Score Ranking - Configuration (DOCK6 analysis)
# =============================================================================
# Ranks molecules by Grid_Score, decomposes into vdW + ES.
#
# INPUT:  05_results/{campaign_id}/01d_score_collection/dock6_all_poses.csv
# OUTPUT: 05_results/{campaign_id}/05_dock6/04a_score_ranking/
#
# Project: molecular_docking
# Module: 04a (DOCK6 analysis)
# Version: 1.0 (2026-03-22)
# =============================================================================

parameters:
  # Score field to rank by
  score_key: "Grid_Score"

  # Limit output to top N molecules (0 = all)
  top_n: 0

  log_level: "INFO"

outputs:
  subdir: "05_dock6/04a_score_ranking"

# =============================================================================
# USAGE
# =============================================================================
# python 02_scripts/04a_score_ranking.py \
#     --config 03_configs/04a_score_ranking.yaml \
#     --campaign 04_data/campaigns/example_campaign/campaign_config.yaml
# =============================================================================
