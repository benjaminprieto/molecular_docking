# =============================================================================
# 02b Vina Runner - Configuration (molecular_docking v1.0)
# =============================================================================
# Ejecuta AutoDock Vina o Vina-GPU para cada ligando preparado.
#
# ENGINES SOPORTADOS:
#   "vina"     → AutoDock Vina 1.2.x (CPU, estándar)
#   "vina-gpu" → Vina-GPU 2.1 (GPU-accelerated, requiere CUDA)
#
# Selector en este YAML via parameters.engine. Override con --engine.
#
# INPUT PATHS come from campaign_config.yaml + hardcoded upstream conventions:
#   - Vina inputs: 05_results/{campaign_id}/02a_vina_preparation/vina_inputs.json
#   - Output:      05_results/{campaign_id}/02b_vina_run/
#
# PRECONDITIONS:
#   - Module 02a must have been run (vina_inputs.json)
#   - Vina or Vina-GPU installed and in PATH (or specify vina_path)
#
# Project: molecular_docking
# Module: 02b
# Version: 1.0
# =============================================================================

# -----------------------------------------------------------------------------
# PARAMETERS
# -----------------------------------------------------------------------------
parameters:

  # --- Engine Selection ---

  # Motor de docking:
  #   "vina"     = AutoDock Vina 1.2.x (CPU)
  #   "vina-gpu" = Vina-GPU 2.1 (GPU-accelerated)
  #
  # Vina-GPU requiere:
  #   - CUDA toolkit instalado
  #   - GPU compatible (RTX A6000 ideal)
  #   - Binary vina-gpu o Vina-GPU en PATH
  engine: "vina"

  # --- Search Parameters ---

  # Exhaustividad de búsqueda (mayor = más thorough pero más lento)
  # Vina default: 8
  # Para screening rápido: 8
  # Para resultados más precisos: 16-32
  exhaustiveness: 8

  # Número máximo de poses por molécula
  num_modes: 9

  # Rango de energía máximo respecto a la mejor pose (kcal/mol)
  # Solo se reportan poses con ΔG ≤ best + energy_range
  energy_range: 3.0

  # Semilla para reproducibilidad
  seed: 42

  # --- Autobox ---

  # Si true, usa --autobox_ligand con el ligando de referencia
  # en vez de las coordenadas del vina_inputs.json
  use_autobox: false

  # Path al ligando de referencia (null = detectar automáticamente)
  autobox_ligand: null

  # Padding para autobox (Angstroms)
  autobox_add: 6.0

  # --- Execution ---

  # Workers paralelos
  # Vina CPU: 4-8 workers con 1 CPU cada uno
  # Vina-GPU: 1-2 workers (GPU se satura con más)
  n_workers: 4

  # CPUs por worker (threads de Vina)
  # Para n_workers > 1, mantener cpu_per_worker=1
  # Para n_workers=1, puede subir cpu_per_worker=4-8
  cpu_per_worker: 1

  # Timeout por molécula (segundos)
  timeout: 600

  # Path a ejecutable Vina (null = buscar automáticamente)
  # Busca en: vina, /usr/local/bin/vina, ~/bin/vina
  vina_path: null

  # --- Vina-GPU Specific ---

  # Batch size para Vina-GPU (0 = auto)
  # Mayor batch = más uso de GPU pero más memoria
  gpu_batch_size: 0

  # --- Logging ---
  log_level: "INFO"

# -----------------------------------------------------------------------------
# OUTPUT
# -----------------------------------------------------------------------------
outputs:
  subdir: "02b_vina_run"

  # Generated files:
  #   vina_results.csv           Resultados principales
  #   vina_results.json          Resultados en JSON
  #   vina_summary.txt           Resumen legible
  #   poses/
  #     {name}/
  #       {name}_vina.pdbqt      Poses docked
  #       vina.log               Stdout de Vina
  #   02b_vina_run.log

# =============================================================================
# USAGE
# =============================================================================
# # Vina CPU (default):
# python 02_scripts/02b_vina_runner.py --config 03_configs/02b_vina_runner.yaml --campaign 04_data/campaigns/example_campaign/campaign_config.yaml
#
# # Vina-GPU:
# python 02_scripts/02b_vina_runner.py --config 03_configs/02b_vina_runner.yaml --campaign 04_data/campaigns/example_campaign/campaign_config.yaml --engine vina-gpu
#
# # Override exhaustiveness:
# python 02_scripts/02b_vina_runner.py --config 03_configs/02b_vina_runner.yaml --campaign 04_data/campaigns/example_campaign/campaign_config.yaml --exhaustiveness 32
#
# # Check installation:
# python 02_scripts/02b_vina_runner.py --check
# python 02_scripts/02b_vina_runner.py --check --engine vina-gpu
#
# PyCharm Run Configuration:
#   Script:     02_scripts/02b_vina_runner.py
#   Parameters: --config 03_configs/02b_vina_runner.yaml --campaign 04_data/campaigns/example_campaign/campaign_config.yaml
#   Working dir: (project root)
# =============================================================================

# =============================================================================
# OUTPUT COLUMNS (vina_results.csv)
# =============================================================================
# - name:           Nombre de la molécula
# - success:        True/False
# - affinity:       Mejor score Vina (kcal/mol, más negativo = mejor)
# - rmsd_lb:        RMSD lower bound de la mejor pose
# - rmsd_ub:        RMSD upper bound de la mejor pose
# - n_poses:        Número de poses generadas
# - output_file:    PDBQT con poses docked
# - ligand_file:    PDBQT del ligando de entrada
# - log_file:       Log de Vina
# - error:          Mensaje de error si falló
# - runtime:        Tiempo de ejecución (segundos)
# - engine:         "vina" o "vina-gpu"
# =============================================================================

# =============================================================================
# VINA vs VINA-GPU
# =============================================================================
#
# Vina 1.2.x (CPU):
#   + Estable, ampliamente validado
#   + No requiere GPU
#   + Reproducible (deterministic con seed fijo)
#   - Lento para bibliotecas grandes (>1000 moléculas)
#   Típico: 30-120s por molécula (exh=8)
#
# Vina-GPU 2.1:
#   + 10-50x más rápido que CPU
#   + Ideal para screening masivo
#   - Requiere CUDA + GPU compatible
#   - Puede dar resultados ligeramente diferentes al CPU
#   Típico: 2-10s por molécula (exh=8)
#
# Recomendación:
#   - Screening inicial: Vina-GPU con exh=8
#   - Refinamiento: Vina CPU con exh=32
#   - Validación: Vina CPU (reproducibilidad)
# =============================================================================