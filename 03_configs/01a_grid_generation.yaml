# =============================================================================
# 01a Grid Generation - Configuration
# =============================================================================
# Generate DOCK6 grids from the prepared receptor.
#
# Pipeline: DMS surface → sphgen → sphere_selector → showbox → grid
#
# Output filenames match DOCK6 tutorial conventions:
#   receptor.ms, all_spheres.sph, spheres_ligand.sph,
#   spheres_ligand_box.pdb, ligand.nrg, ligand.bmp
#
# All outputs are visualizable in ChimeraX for validation.
#
# OUTPUT: 05_results/{campaign_id}/01a_grid_generation/
#
# Project: molecular_docking
# Module: 01a
# Version: 2.2
# =============================================================================

parameters:
  # DMS surface probe radius (Angstroms)
  probe_radius: 1.4

  # Box margin around selected spheres (Angstroms)
  # 5.0 = standard (matches DOCK6 tutorial)
  # 10.0 = generous (larger box, slower grid calculation)
  box_margin: 5.0

  # Grid spacing (Angstroms)
  # 0.3 = standard (good balance of accuracy and speed)
  # 0.2 = high resolution (slower, more accurate)
  grid_spacing: 0.3

  # Energy cutoff distance
  energy_cutoff_distance: 9999.0

  # VdW potential exponents
  attractive_exponent: 6
  repulsive_exponent: 12

  # Dielectric factor for electrostatic scoring
  dielectric_factor: 4

  # Bump overlap threshold
  bump_overlap: 0.75

  # DOCK6 installation path (for finding parameter files)
  # Set this if vdw_AMBER_parm99.defn is not auto-detected.
  # dock6_home: "/opt/dock6"

  # Log level
  log_level: "INFO"

# -----------------------------------------------------------------------------
# OUTPUT
# -----------------------------------------------------------------------------
outputs:
  subdir: "01a_grid_generation"

  # Files generated (all visualizable in ChimeraX):
  #   receptor.ms              -> DMS molecular surface
  #   all_spheres.sph          -> all spheres from sphgen
  #   INSPH, OUTSPH            -> sphgen input/output
  #   spheres_ligand.sph       -> selected spheres near binding site
  #   box.in                   -> showbox input (reproducibility)
  #   spheres_ligand_box.pdb   -> grid box as PDB
  #   grid.in, grid.out        -> grid input/output
  #   ligand.nrg               -> energy grid
  #   ligand.bmp               -> bump grid
  #   grid_generation_report.json
  #   01a_grid_generation.log

# =============================================================================
# USAGE (PyCharm Pro terminal — single line)
# =============================================================================
# python 02_scripts/01a_grid_generation.py --config 03_configs/01a_grid_generation.yaml --campaign 04_data/campaigns/example_campaign/campaign_config.yaml
#
# # Force regeneration:
# python 02_scripts/01a_grid_generation.py --config 03_configs/01a_grid_generation.yaml --campaign 04_data/campaigns/example_campaign/campaign_config.yaml --force
#
# PyCharm Run Configuration:
#   Script:     02_scripts/01a_grid_generation.py
#   Parameters: --config 03_configs/01a_grid_generation.yaml --campaign 04_data/campaigns/example_campaign/campaign_config.yaml
#   Working dir: (project root)
# =============================================================================