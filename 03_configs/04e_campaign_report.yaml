# =============================================================================
# 04e Campaign Report - Configuration (DOCK6 analysis)
# =============================================================================
# HTML report with composite ranking from 04a-04d.
#
# INPUT:  05_results/{campaign_id}/04_dock6_analysis/04a-04d outputs
# OUTPUT: 05_results/{campaign_id}/04_dock6_analysis/04e_campaign_report/
#
# Project: molecular_docking
# Module: 04e (DOCK6 analysis)
# Version: 1.1 (2026-03-23) — path fix: 05_dock6 → 04_dock6_analysis
# =============================================================================

parameters:
  # Composite ranking weights (must sum to 1.0)
  composite_weights:
    grid_score: 0.40    # Binding energy (Grid_Score)
    fps_score:  0.30    # Footprint similarity to reference
    n_modes:    0.15    # Binding mode diversity
    score_std:  0.15    # Score reproducibility across modes

  log_level: "INFO"

outputs:
  subdir: "04_dock6_analysis/04e_campaign_report"

# =============================================================================
# USAGE
# =============================================================================
# python 02_scripts/04e_campaign_report.py \
#     --config 03_configs/04e_campaign_report.yaml \
#     --campaign 04_data/campaigns/UDX_pharmit_pH63/campaign_config.yaml
# =============================================================================
