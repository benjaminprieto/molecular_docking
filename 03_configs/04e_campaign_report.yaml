# =============================================================================
# 04e Campaign Report - Configuration (DOCK6 analysis v3.0)
# =============================================================================
# HTML report with composite = mean Grid_Score across all binding modes.
#
# INPUT:  05_results/{campaign_id}/04_dock6_analysis/04a-04d outputs
# OUTPUT: 05_results/{campaign_id}/04_dock6_analysis/04e_campaign_report/
#
# Composite: Grid_Score × weighted_consistency (from 04b per-pose analysis)
# gnina_scores.csv optional — used only for drug-likeness columns.
#
# Project: molecular_docking
# Module: 04e (DOCK6 analysis)
# Version: 4.0 (2026-03-27)
# =============================================================================

parameters:
  # Composite = mean Grid_Score across all binding modes
  composite_method: "mean_grid_score"

  # Number of top molecules shown in each table
  top_n: 20

  # Drug-likeness source (null = auto-detect)
  gnina_scores_csv: null

  log_level: "INFO"

outputs:
  subdir: "04_dock6_analysis/04e_campaign_report"

# =============================================================================
# USAGE
# =============================================================================
# python 02_scripts/04e_campaign_report.py \
#     --config 03_configs/04e_campaign_report.yaml \
#     --campaign 04_data/campaigns/UDX_namiki_pH63/campaign_config.yaml
# =============================================================================