# =============================================================================
# 02a Score Collection - Configuration
# =============================================================================
# Collects DOCK6 docking scores, ranks molecules, and produces Excel output.
#
# Scans 01b output for scored mol2 files, extracts best pose per molecule,
# and generates ranked spreadsheets compatible with dock2profile.
#
# INPUT:  05_results/{campaign_id}/01b_dock6_run/{name}/{name}_scored.mol2
# OUTPUT: 05_results/{campaign_id}/02a_score_collection/
#
# Project: molecular_docking
# Module: 02a
# Version: 1.0
# =============================================================================

parameters:
  # Score field to rank by (lower = better binding)
  # "Grid_Score" = total grid score (vdW + electrostatic)
  score_key: "Grid_Score"

  # Maximum molecules in output (0 = all)
  max_molecules: 500

  # Extract best pose mol2 per molecule (for visualization)
  extract_best_pose_mol2: true

  # Keep all poses per molecule (not just best)
  keep_all_poses: false

  # Compute RDKit molecular properties (MW, LogP, HBA, HBD, TPSA, RotBonds)
  compute_properties: true

  # Log level
  log_level: "INFO"

# -----------------------------------------------------------------------------
# OUTPUT
# -----------------------------------------------------------------------------
outputs:
  subdir: "02a_score_collection"

  # Files generated:
  #   dock6_scores.xlsx                -> ranked Excel
  #   dock6_scores.csv                 -> ranked CSV
  #   score_collection_summary.txt     -> human-readable summary
  #   score_collection_report.json     -> machine-readable report
  #   best_poses/{name}.mol2           -> best pose per molecule
  #   02a_score_collection.log

# =============================================================================
# USAGE (PyCharm Pro terminal — single line)
# =============================================================================
# python 02_scripts/02a_score_collection.py --config 03_configs/02a_score_collection.yaml --campaign 04_data/campaigns/example_campaign/campaign_config.yaml
#
# PyCharm Run Configuration:
#   Script:     02_scripts/02a_score_collection.py
#   Parameters: --config 03_configs/02a_score_collection.yaml --campaign 04_data/campaigns/example_campaign/campaign_config.yaml
#   Working dir: (project root)
# =============================================================================