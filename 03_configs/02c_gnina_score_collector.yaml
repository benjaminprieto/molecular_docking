# =============================================================================
# 02c GNINA Score Collector - Configuration (molecular_docking v2.0)
# =============================================================================
# Recolecta, enriquece y exporta scores de GNINA a CSV + Excel.
#
# Rankings múltiples: Vina affinity, CNN score, CNN affinity, consenso.
# NO incluye comparación cruzada con DOCK6 (eso es dock2profile).
#
# INPUT:  05_results/{campaign_id}/02b_gnina_run/gnina_results.csv
# OUTPUT: 05_results/{campaign_id}/02c_gnina_scores/
#
# Project: molecular_docking
# Module: 02c (GNINA engine)
# Version: 1.1 — keep_all_poses for clustering (2026-03-21)
#
# CHANGES v1.0 → v1.1:
#   - keep_all_poses: NEW (default true) — reads output SDF files from 02b,
#     extracts scores for ALL poses, exports gnina_all_poses.csv for
#     clustering module 03a
# =============================================================================

parameters:
  top_n: 10

  # Criterio primario de ranking:
  #   "cnn_affinity"  = CNN-predicted affinity (default, más informativo)
  #   "cnn_score"     = Probabilidad de pose correcta
  #   "vina_affinity" = Score Vina clásico
  #   "consensus"     = Promedio de los tres rankings
  rank_by: "vina_affinity"

  # Export ALL poses per molecule to gnina_all_poses.csv
  # Required for clustering module (03a)
  keep_all_poses: true

  name_column: "Name"
  export_excel: true
  log_level: "INFO"

outputs:
  subdir: "02c_gnina_scores"

# =============================================================================
# USAGE
# =============================================================================
# python 02_scripts/02c_gnina_score_collector.py \
#     --config 03_configs/02c_gnina_score_collector.yaml \
#     --campaign 04_data/campaigns/example_campaign/campaign_config.yaml
#
# OUTPUT FILES:
#   gnina_scores.csv       — 1 row per molecule (best pose), ranked
#   gnina_scores.xlsx      — Same, Excel format
#   gnina_all_poses.csv    — 1 row per pose (~100 per molecule), for clustering
# =============================================================================