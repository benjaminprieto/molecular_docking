# =============================================================================
# 04b Footprint Analysis - Configuration (DOCK6 analysis v4.0)
# =============================================================================
# Per-residue vdW + ES energy decomposition via DOCK6 footprint scoring.
# Now includes per-pose residue consistency for multiplicative composite.
#
# INPUT:  05_results/{campaign_id}/01d_footprint_rescore/{name}/
#         05_results/{campaign_id}/00b_receptor_preparation/rec_charged.mol2
#         05_results/{campaign_id}/00b_receptor_preparation/rec_noH.pdb
# OUTPUT: 05_results/{campaign_id}/04_dock6_analysis/04b_footprint_analysis/
#
# REFERENCE: Balius et al. J Chem Inf Model 2011, 51(8):1942-56
#
# Project: molecular_docking
# Module: 04b (DOCK6 analysis)
# Version: 4.0 (2026-03-27)
# =============================================================================

parameters:
  # Fraction of molecules that must contact a residue for it to be
  # classified as "pharmacophoric" (0.0 - 1.0)
  pharmacophore_threshold: 0.8

  # Minimum total energy for a residue to count as "contributing"
  # (kcal/mol, must be more negative than this)
  energy_cutoff: -0.5

  # Per-pose consistency analysis (new in v4.0)
  # Analyze ALL poses per molecule (not just best)
  best_pose_only: false

  # Min |mean_energy| to include residue in weighted_consistency calc
  consistency_threshold: 0.5

  # Energy below this is "favorable" (0.0 = any negative)
  favorable_threshold: 0.0

  # Timeout per molecule for DOCK6 re-scoring (seconds)
  timeout: 120

  # Override reference mol2 (null = auto-detect from 01d best_poses)
  reference_mol2: null

  log_level: "INFO"

outputs:
  rescore_subdir: "04_dock6_analysis/04b_footprint_rescore"
  analysis_subdir: "04_dock6_analysis/04b_footprint_analysis"

# =============================================================================
# USAGE
# =============================================================================
# python 02_scripts/04b_footprint_analysis.py \
#     --config 03_configs/04b_footprint_analysis.yaml \
#     --campaign 04_data/campaigns/UDX_namiki_pH63/campaign_config.yaml
# =============================================================================