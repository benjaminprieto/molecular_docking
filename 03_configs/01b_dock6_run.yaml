# =============================================================================
# 01b DOCK6 Run - Configuration
# =============================================================================
# Runs DOCK6 flexible/rigid docking for each prepared ligand.
#
# DOCK6 scoring: grid-based energy (van der Waals + electrostatic)
# Anchor-and-grow flexible docking with simplex minimization.
#
# ROUTING (v2.0):
#   Ligands: 00d_antechamber/mol2/ first, then 00c_ligand_preparation/mol2/
#   Grids:   01a_grid_generation/ first, then campaign grids.grid_dir
#
# PATH FIX (v2.0):
#   DOCK6 truncates paths at ~80 chars (Fortran legacy).
#   This module creates symlinks in each mol_out/ and uses short filenames.
#   dock6 runs with cwd=mol_out/ so all paths are relative.
#
# OUTPUT: 05_results/{campaign_id}/01b_dock6_run/
#
# DOCK6 parameters reference:
#   https://dock.compbio.ucsf.edu/DOCK_6/dock6_manual.htm
#
# Project: molecular_docking
# Module: 01b
# Version: 2.0 — routing fix + symlinks (2026-03-13)
# =============================================================================

parameters:
  # --- Search method ---
  # "flex"   -> anchor-and-grow (standard for drug-like molecules)
  # "rigid"  -> rigid body (orientation only, no flexibility)
  search_method: "flex"

  # --- Flex-specific: anchor-and-grow ---
  min_anchor_size: 5
  pruning_max_orients: 1000
  pruning_clustering_cutoff: 100
  pruning_conformer_score_cutoff: 100.0

  # --- Orientation ---
  max_orientations: 1000

  # --- Minimization (simplex) ---
  minimize: true
  simplex_max_iterations: 500
  simplex_max_cycles: 1
  simplex_score_converge: 0.1
  simplex_cycle_converge: 1.0
  simplex_trans_step: 1.0
  simplex_rot_step: 0.1
  simplex_tors_step: 10.0

  # --- Output ---
  num_scored_conformers: 20
  write_orientations: false

  # --- Execution ---
  timeout_per_molecule: 600

  # Log level
  log_level: "INFO"

# -----------------------------------------------------------------------------
# OUTPUT
# -----------------------------------------------------------------------------
outputs:
  subdir: "01b_dock6_run"

  # Per-molecule:
  #   {name}/dock6.in              -> DOCK6 input file
  #   {name}/dock6.out             -> DOCK6 log
  #   {name}/{name}_scored.mol2    -> scored poses
  #
  # Global:
  #   docking_status.csv           -> per-molecule status
  #   docking_summary.txt          -> human-readable summary
  #   01b_dock6_run.log

# =============================================================================
# USAGE (PyCharm Pro terminal — single line)
# =============================================================================
# python 02_scripts/01b_dock6_run.py --config 03_configs/01b_dock6_run.yaml --campaign 04_data/campaigns/example_campaign/campaign_config.yaml
#
# # Single molecule:
# python 02_scripts/01b_dock6_run.py --config 03_configs/01b_dock6_run.yaml --campaign 04_data/campaigns/example_campaign/campaign_config.yaml --name MolPort-047-542-199
#
# # Dry run:
# python 02_scripts/01b_dock6_run.py --config 03_configs/01b_dock6_run.yaml --campaign 04_data/campaigns/example_campaign/campaign_config.yaml --dry-run
#
# PyCharm Run Configuration:
#   Script:     02_scripts/01b_dock6_run.py
#   Parameters: --config 03_configs/01b_dock6_run.yaml --campaign 04_data/campaigns/example_campaign/campaign_config.yaml
#   Working dir: (project root)
# =============================================================================