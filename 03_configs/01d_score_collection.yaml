# =============================================================================
# 01d Score Collection - Configuration (DOCK6 engine)
# =============================================================================
# Collects DOCK6 docking scores, ranks molecules, and produces Excel/CSV.
#
# Extracts ALL fields from DOCK6 scored mol2 headers:
#   Grid_Score, Grid_vdw_energy, Grid_es_energy, Internal_energy_repulsive,
#   DOCK_Rotatable_Bonds, Formal_Charge, Heavy_Atoms, Molecular_Weight,
#   HBond_Acceptors, HBond_Donors
#
# Merges SMILES from 00a unique_molecules.csv for downstream enrichment.
#
# Molecular property enrichment (LogP, QED, PAINS, LE, pIC50, etc.)
# is handled by the external molecular_metrics package.
#
# INPUT:  05_results/{campaign_id}/01c_dock6_run/{name}/{name}_scored.mol2
# OUTPUT: 05_results/{campaign_id}/01d_score_collection/
#
# Project: molecular_docking
# Module: 01d (DOCK6)
# Version: 2.1 — keep_all_poses for clustering (2026-03-21)
#
# CHANGES v2.0 → v2.1:
#   - keep_all_poses: NEW (default true) — exports dock6_all_poses.csv
#     with one row per pose per molecule for clustering module 03a
#   - max_molecules: 500 → 0 (no limit, keep all)
# =============================================================================

parameters:
  # Score field to rank by (DOCK6 default: Grid_Score)
  score_key: "Grid_Score"

  # Maximum molecules in output (0 = all)
  max_molecules: 0

  # Extract best pose mol2 per molecule
  extract_best_pose_mol2: true

  # Export ALL poses per molecule to dock6_all_poses.csv
  # Required for clustering module (03a)
  keep_all_poses: true

  # Log level: DEBUG, INFO, WARNING, ERROR
  log_level: "INFO"

outputs:
  subdir: "01d_score_collection"

# =============================================================================
# USAGE
# =============================================================================
# python 02_scripts/01d_score_collection.py \
#     --config 03_configs/01d_score_collection.yaml \
#     --campaign 04_data/campaigns/example_campaign/campaign_config.yaml
#
# OUTPUT FILES:
#   dock6_scores.csv       — 1 row per molecule (best pose), for ranking
#   dock6_scores.xlsx      — Same as above, Excel format
#   dock6_all_poses.csv    — 1 row per pose (~100 per molecule), for clustering
#   best_poses/            — Best pose mol2 files
# =============================================================================