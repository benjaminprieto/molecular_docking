# =============================================================================
# 06a Pharmit Pharmacophore Generator - Configuration (v3.0)
# =============================================================================
# Generate ranked sub-pocket Pharmit queries from crystal reference.
#
# Uses PLIP interactions (real geometric criteria) ranked by DOCK6 footprint
# energy (per-residue vdW + ES). GNINA --score_only runs internally as
# supplementary context.
#
# INPUT:
#   Reference ligand (SDF/mol2, crystal coords)
#   Clean receptor PDB (from 00b)
#   PLIP interactions JSON (from external PLIP analysis)
#   DOCK6 residue_consensus.csv (from 04b, optional)
#
# OUTPUT: 05_results/{campaign_id}/06a_pharmit/
#   pharmacophore_{strategy}.json  — Pharmit JSONs per strategy
#   pharmacophore_ranking.csv      — Decision table
#   pharmacophore_ranking.txt      — Human-readable summary
#   pharmacophore_rescore.sdf      — GNINA rescore (intermediate)
#
# Strategies:
#   xylose:    Sugar pocket only (TRP495, TRP392, ASP494 zone)
#   uracil:    Base pocket only (HIS335, ASP361, THR390 zone)
#   combined:  Best anchors without phosphates (drug-like)
#   analogues: Full pharmacophore with NegativeIon (bioisosteres)
#   druglike:  Phosphate positions converted to HBA (broad search)
#
# Project: molecular_docking
# Module: 06a
# Version: 3.0
# =============================================================================

parameters:

  # Features per query
  n_required: 3
  n_optional: 2

  # Pharmit feature radius (Angstrom)
  radius: 1.0

  # Exclude features with DOCK6 energy above this cutoff (repulsive)
  energy_cutoff: 0.0

  # Include Hydrophobic features
  include_hydrophobic: false

  # Which strategies to generate (default: all)
  # strategies:
  #   - xylose
  #   - uracil
  #   - combined
  #   - analogues
  #   - druglike

  # Output filename base
  output_name: "pharmacophore"

  log_level: "INFO"

outputs:
  subdir: "06a_pharmit"

# =============================================================================
# USAGE
# =============================================================================
#
# With campaign + PLIP + DOCK6:
#   python 02_scripts/06a_pharmit_pharmacophore.py \
#       --campaign 04_data/campaigns/UDX_pharmit_pH63/campaign_config.yaml \
#       --config 03_configs/06a_pharmit_pharmacophore.yaml \
#       --plip 04_data/campaigns/UDX_pharmit_pH63/interactions/udx_interactions.json
#
# Direct (all inputs explicit):
#   python 02_scripts/06a_pharmit_pharmacophore.py \
#       --ligand molecules/UDX.mol2 \
#       --receptor 05_results/.../00b_receptor_preparation/receptor_clean.pdb \
#       --plip interactions/udx_interactions.json \
#       --dock6 05_results/.../04b_footprint_analysis/residue_consensus.csv \
#       --output 05_results/.../06a_pharmit/
#
# Single strategy:
#   python 02_scripts/06a_pharmit_pharmacophore.py \
#       --plip udx_interactions.json \
#       --campaign ... --config ... \
#       --strategies combined,druglike
#
# =============================================================================